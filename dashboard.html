<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d69"><title>Dashboard | AksaraEdu</title>
<style>
:root{--navy:#10345e;--blue:#174b85;--gold:#f0ad35;--ink:#20334b;--muted:#687b91;--line:#e4ebf3}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:var(--ink)}header{background:white;border-bottom:1px solid var(--line);padding:15px 6%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:800;color:var(--blue);font-size:22px}.brand span{color:var(--gold)}.logout{border:0;background:#eef4fb;color:var(--blue);padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}.container{max-width:1150px;margin:auto;padding:35px 6%}.welcome{background:linear-gradient(120deg,#10345e,#2166a7);color:white;border-radius:18px;padding:28px}.welcome small{color:#d9e9fa}.welcome h1{margin:7px 0;font-size:28px}.welcome p{margin:0;color:#d9e9fa}.role{display:inline-block;margin-top:15px;padding:6px 10px;border-radius:20px;background:#ffffff22;font-size:11px;font-weight:700}.heading{margin:30px 0 14px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;min-height:150px}.tile .ico{font-size:26px}.tile h3{margin:9px 0 5px;font-size:16px;color:var(--navy)}.tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.status{padding:13px 15px;border-radius:10px;background:#fff8e8;color:#76500d;font-size:13px;margin-top:20px;line-height:1.6}.error{background:#fff0f0;color:#a52828;padding:20px;border-radius:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.container{padding:25px 5%}}@media(max-width:450px){.grid{grid-template-columns:1fr}header{padding:13px 5%}}
</style></head><body><header><div class="brand">Aksara<span>Edu</span></div><button class="logout" id="logoutBtn">Keluar</button></header><main class="container"><section class="welcome"><small>RUANG KERJA AKSARAEDU</small><h1 id="greeting">Memuat dashboard...</h1><p id="subline">Memeriksa identitas dan hak akses akun.</p><span class="role" id="roleLabel">Memuat peran</span></section><h2 class="heading">Menu utama</h2><section class="grid" id="menuGrid"></section><div class="status" id="statusBox">Dashboard sedang disiapkan. Fitur pengelolaan akan diaktifkan bertahap.</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const cfg=window.AKSARA_SUPABASE_CONFIG||{};const ready=cfg.SUPABASE_URL?.startsWith('https://')&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_ANON_KEY.startsWith('ISI_');let client;
const menus={admin:[['👥','Data Pengguna','Kelola akun siswa, guru, dan administrator.'],['📝','Bank Soal','Kelola kumpulan soal dan kunci jawaban.'],['🗓️','Jadwal Ujian','Atur jadwal dan pelaksanaan ujian.'],['📊','Hasil dan Analisis','Pantau hasil ujian dan perkembangan siswa.'],['🏫','Data Sekolah','Kelola sekolah, kelas, dan mata pelajaran.'],['⚙️','Pengaturan','Pengaturan platform dan hak akses.']],teacher:[['📝','Bank Soal','Buat, ubah, dan kelola soal pembelajaran.'],['🗓️','Ujian Saya','Susun dan kelola ujian untuk siswa.'],['📊','Hasil Siswa','Lihat hasil dan rekap nilai peserta.'],['📚','Materi Pembelajaran','Kelola materi dan sumber belajar.']],student:[['🖥️','Ujian Tersedia','Lihat ujian yang ditugaskan kepada akunmu.'],['✍️','Latihan Soal','Asah kemampuan melalui latihan.'],['📈','Hasil Evaluasi','Lihat hasil dan umpan balik belajar.'],['📚','Materi Pembelajaran','Pelajari materi sesuai kelas.']]};
function fail(msg){document.querySelector('.container').innerHTML='<div class="error">'+msg+'<br><br><a href="./login.html">Kembali ke halaman login</a></div>'}
async function init(){if(!ready){fail('Konfigurasi Supabase belum diisi pada supabase-config.js.');return}client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data:{session},error}=await client.auth.getSession();if(error||!session){location.href='./login.html';return}const {data:profile,error:profileError}=await client.from('profiles').select('id,full_name,role,school_id,class_id').eq('id',session.user.id).single();if(profileError||!profile){await client.auth.signOut();fail('Profil akun belum ditemukan atau belum memiliki izin akses. Hubungi administrator sekolah.');return}const role=String(profile.role||'').toLowerCase();if(!menus[role]){fail('Peran akun tidak dikenali. Hubungi administrator.');return}document.getElementById('greeting').textContent='Selamat datang, '+(profile.full_name||session.user.email);document.getElementById('subline').textContent=role==='admin'?'Kelola platform AksaraEdu dan layanan pendidikan.':role==='teacher'?'Kelola pembelajaran, soal, dan evaluasi siswa.':'Akses kegiatan belajar dan evaluasi milikmu.';document.getElementById('roleLabel').textContent=({admin:'ADMINISTRATOR',teacher:'GURU',student:'SISWA'})[role];document.getElementById('menuGrid').innerHTML=menus[role].map(m=>'<article class="tile"><div class="ico">'+m[0]+'</div><h3>'+m[1]+'</h3><p>'+m[2]+'</p></article>').join('');document.getElementById('statusBox').textContent='Login aktif. Menu ini merupakan kerangka dashboard; fungsi pengelolaan soal, ujian, dan nilai akan dihubungkan pada tahap berikutnya.'}
document.getElementById('logoutBtn').addEventListener('click',async()=>{if(client)await client.auth.signOut();location.href='./login.html'});init();
</script></body></html>
